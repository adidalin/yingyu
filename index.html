<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小学英语闪卡</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --brand: #4f46e5;
      --brand-2: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --tag-word-bg: #eff6ff;
      --tag-word-color: #1d4ed8;
      --tag-sentence-bg: #fef3c7;
      --tag-sentence-color: #b45309;
      --danger: #f43f5e;
      --danger-soft: #fff1f2;
      --shadow: 0 12px 34px rgba(15, 23, 42, 0.06);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: min(1200px, 96vw);
      height: min(820px, 96vh);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 26px;
    }

    #selection-screen, #game-screen, #mistake-screen {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    #selection-screen { display: flex; }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(1.8rem, 2.2vw, 2.5rem);
      font-weight: 800;
    }

    .unit-list {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      overflow-y: auto;
      padding: 4px 2px 12px;
    }

    .unit-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 120px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .unit-item:hover {
      transform: translateY(-2px);
      border-color: #cbd5e1;
    }

    .unit-item strong {
      display: block;
      font-size: 1.1rem;
      line-height: 1.3;
    }

    .unit-item span {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .unit-item [span-type="w"] {
      background: var(--tag-word-bg);
      color: var(--tag-word-color);
    }

    .unit-item [span-type="s"] {
      background: var(--tag-sentence-bg);
      color: var(--tag-sentence-color);
    }

    input[type="checkbox"] { display: none; }
    input[type="checkbox"]:checked + .unit-item {
      background: #f5f3ff;
      border-color: var(--brand);
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.12);
    }
    input[type="checkbox"]:checked + .unit-item strong { color: var(--brand); }
    input[type="checkbox"]:checked + .unit-item::after {
      content: "✓";
      position: absolute;
      top: -8px; right: -8px;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      background: var(--brand-2);
      color: white;
      font-weight: 700;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.4);
    }

    .selection-bottom {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }

    .btn {
      border: 2px solid transparent;
      border-radius: 14px;
      min-height: 52px;
      padding: 12px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: var(--brand-2);
      color: white;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    .btn-secondary {
      background: white;
      color: var(--brand);
      border-color: var(--brand);
    }

    .btn-ghost {
      background: #f1f5f9;
      color: var(--muted);
    }

    .btn-danger {
      background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
      color: white;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecdd3;
    }

    .top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px dashed var(--line);
      margin-bottom: 16px;
      color: var(--muted);
      font-weight: 600;
    }

    .top-info b { color: var(--ink); }
    #round-txt { color: var(--brand); font-size: 1.3rem; }
    #unit-txt {
      background: #f1f5f9;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 0.95rem;
    }
    #left-txt { color: var(--brand); }

    .card-display {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.03);
      margin: 10px 0 12px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card-display::before {
      content: "";
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(226,232,240,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(226,232,240,0.5) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
    }

    #text-content {
      position: relative;
      z-index: 1;
      font-size: clamp(2.5rem, 5vw, 6rem);
      line-height: 1.2;
      text-align: center;
      font-weight: 800;
      padding: 0 16px;
      word-break: break-word;
    }

    .mark-hint {
      min-height: 24px;
      text-align: center;
      color: var(--danger);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .bottom-bar {
      display: flex;
      gap: 12px;
      height: 64px;
    }

    .bottom-bar .btn, .selection-bottom .btn, .mistake-bottom .btn {
      flex: 1;
    }

    .mistake-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--line);
      margin-bottom: 12px;
    }

    .mistake-header h2 {
      margin: 0;
      font-size: 1.7rem;
    }

    .badge {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecdd3;
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: 700;
    }

    .mistake-list {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .mistake-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 12px;
      background: white;
    }

    .mistake-item-text {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .mistake-item-text .text {
      font-weight: 700;
      font-size: 1.2rem;
      word-break: break-word;
    }

    .mistake-item-text .unit {
      display: inline-block;
      width: fit-content;
      background: #f1f5f9;
      border-radius: 6px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .mistake-item .count {
      background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
      color: white;
      min-width: 76px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 0 8px;
      margin-left: 12px;
      white-space: nowrap;
    }

    .mistake-empty {
      text-align: center;
      color: var(--muted);
      padding: 80px 20px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .mistake-bottom {
      display: flex;
      gap: 16px;
      border-top: 2px solid var(--line);
      padding-top: 16px;
      margin-top: 8px;
    }

    #toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      opacity: 0;
      visibility: hidden;
      background: rgba(15, 23, 42, 0.95);
      color: white;
      padding: 18px 28px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      transition: all 0.25s ease;
      z-index: 9999;
      pointer-events: none;
    }

    #toast.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    @media (max-width: 768px) {
      .container { padding: 18px; }
      .top-info { font-size: 0.9rem; }
      .selection-bottom, .mistake-bottom { gap: 10px; }
      .mistake-item { padding: 14px; }
      .mistake-item .count { min-width: 60px; }
    }
  </style>
</head>
<body>
  <div id="toast"></div>

  <div class="container">
    <div id="selection-screen">
      <h1>小学英语闪卡练习</h1>
      <div class="unit-list">
        <input type="checkbox" id="u1_w" value="1_w" />
        <label for="u1_w" class="unit-item"><strong>Unit 1 第一单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u1_s" value="1_s" />
        <label for="u1_s" class="unit-item"><strong>Unit 1 第一单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u2_w" value="2_w" />
        <label for="u2_w" class="unit-item"><strong>Unit 2 第二单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u2_s" value="2_s" />
        <label for="u2_s" class="unit-item"><strong>Unit 2 第二单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u3_w" value="3_w" />
        <label for="u3_w" class="unit-item"><strong>Unit 3 第三单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u3_s" value="3_s" />
        <label for="u3_s" class="unit-item"><strong>Unit 3 第三单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u4_w" value="4_w" />
        <label for="u4_w" class="unit-item"><strong>Unit 4 第四单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u4_s" value="4_s" />
        <label for="u4_s" class="unit-item"><strong>Unit 4 第四单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u5_w" value="5_w" />
        <label for="u5_w" class="unit-item"><strong>Unit 5 第五单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u5_s" value="5_s" />
        <label for="u5_s" class="unit-item"><strong>Unit 5 第五单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u6_w" value="6_w" />
        <label for="u6_w" class="unit-item"><strong>Unit 6 第六单元</strong><span span-type="w">单词 Words</span></label>

        <input type="checkbox" id="u6_s" value="6_s" />
        <label for="u6_s" class="unit-item"><strong>Unit 6 第六单元</strong><span span-type="s">句子 Sentences</span></label>

        <input type="checkbox" id="u7_s" value="7_s" />
        <label for="u7_s" class="unit-item"><strong>拓展内容</strong><span span-type="s">句子 Sentences</span></label>
      </div>

      <div class="selection-bottom">
        <button class="btn btn-secondary" onclick="viewMistakeBook()">错题本</button>
        <button class="btn btn-primary" onclick="startGame()">开始练习 🚀</button>
      </div>
    </div>

    <div id="game-screen">
      <div class="top-info">
        <span>第 <b id="round-txt">1</b> 轮</span>
        <span id="unit-txt">Unit 1</span>
        <span>剩余卡片: <b id="left-txt">0</b></span>
      </div>

      <div class="card-display" onclick="nextCard()">
        <div id="text-content">Ready</div>
      </div>

      <div id="mark-hint" class="mark-hint"></div>

      <div class="bottom-bar">
        <button class="btn btn-ghost" onclick="exitGame()">退出</button>
        <button class="btn btn-ghost" onclick="prevCard()">上一张</button>
        <button class="btn btn-danger-soft" id="mistake-btn" onclick="markMistake()">🤔 不认识</button>
        <button class="btn btn-primary" onclick="nextCard()">下一张 →</button>
      </div>
    </div>

    <div id="mistake-screen">
      <div class="mistake-header">
        <h2>生词错题本</h2>
        <div class="badge" id="mistake-count">0个</div>
      </div>

      <div class="mistake-list" id="mistake-list-container">
        <div class="mistake-empty">暂无错题，太棒了！🌟</div>
      </div>

      <div class="mistake-bottom">
        <button class="btn btn-ghost" onclick="backFromMistakeBook()">返回首页</button>
        <button class="btn btn-primary" id="practice-mistake-btn" onclick="startMistakePractice()">强化练习错题 🎯</button>
        <button class="btn btn-danger" onclick="clearMistakeBook()">清空本子</button>
      </div>
    </div>
  </div>

  <script>
    const data = {
      "1_w": ["feeling", "sad", "angry", "tired", "hungry", "fun", "show", "turn", "apple", "o’clock", "want", "for", "dinner"],
      "1_s": [
        "Look! She is happy.",
        "She is sad.",
        "She is angry!",
        "She is tired.",
        "It’s fun! It’s a nice show!"
      ],
      "2_w": ["yummy", "food", "eat", "banana", "rice", "noodle", "milk", "bread", "like", "but", "good", "us", "cake", "sweet", "ice cream"],
      "2_s": [
        "Let’s eat!",
        "Thank you!",
        "I like bread.",
        "I like apples.",
        "I like bananas. I like milk.",
        "Me too! But...",
        "I love banana milk!"
      ],
      "3_w": ["weather", "windy", "snowy", "rainy", "sunny", "worry", "wait", "later", "egg", "other"],
      "3_s": [
        "May, look!",
        "Thank you, Dad!",
        "What’s the weather like?",
        "It’s sunny.",
        "It’s windy.",
        "She is sad.",
        "Don’t worry, May. Let’s wait for rainy days.",
        "It’s rainy! Hooray!"
      ],
      "4_w": ["season", "spring", "summer", "autumn", "winter", "year", "lots of", "make", "some", "hat"],
      "4_s": [
        "It’s spring. I like spring.",
        "Red, yellow, green... Lots of colours!",
        "It’s summer. I like summer.",
        "Let’s play!",
        "It’s autumn. I like autumn.",
        "Let’s make some pictures!",
        "It’s winter. I like winter."
      ],
      "5_w": ["clothes", "shirt", "skirt", "coat", "shoe", "put", "them", "sun", "put on", "sit", "jump", "favourite"],
      "5_s": [
        "Let’s go!",
        "Put on your shoes, Jeff.",
        "It’s windy.",
        "Put on your coat.",
        "Put on your hat.",
        "No! It’s black. I don’t like black!",
        "Look! It has a black hat, too!",
        "I like my hat!"
      ],
      "6_w": ["holiday", "paper-cut", "up", "put up", "lucky", "kite", "card"],
      "6_s": [
        "Welcome!",
        "Happy Chinese New Year!",
        "Let’s make paper-cuts!",
        "Let’s put up the paper-cuts!",
        "Let’s make jiaozi!",
        "Yummy!",
        "I like jiaozi.",
        "That is a lucky jiaozi."
      ],
      "7_s": [
        "This is Shandong.",
        "Let’s visit some famous houses in Shandong!",
        "It’s Li Qingzhao’s old home. It’s nice.",
        "It’s Wang Xizhi’s old home. It’s big!",
        "Look at the houses!",
        "They’re cool.",
        "It’s a seaweed house.",
        "Look! It’s a siheyuan!",
        "I love Liuzi opera.",
        "This is Zhang Fei. Look at his face! It’s black and white.",
        "Bao Zheng has a black face.",
        "Guan Yu has a red face.",
        "This man has a white face.",
        "I love animals.",
        "Let’s look at some animals in Jinan Zoo!",
        "Look at the monkey! He is so cute.",
        "Look at the pandas!",
        "They are Ya Ji and Hua Ao. They are lovely!",
        "Now let’s look at some fun ‘animals’!",
        "Look! Zhu Bajie has two big ears.",
        "Look at the tigers! They have big eyes!",
        "Look! It’s a rabbit. It’s lovely."
      ]
    };

    const MISTAKE_STORAGE_KEY = 'yingyu_mistake_book';
    const MISTAKE_EXPIRE_DAYS = 30;

    let playQueue = [];
    let index = 0;
    let round = 1;
    let mistakeBook = loadMistakeBook();
    let isMarked = false;
    let isMistakePractice = false;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function getUnitName(u) {
      if (!u) return '未知单元';
      if (u === '7_s') return '拓展 句子';
      const parts = u.split('_');
      if (parts.length < 2) return 'Unit ' + u;
      const unitNum = parts[0];
      const type = parts[1] === 'w' ? '单词' : '句子';
      return 'Unit ' + unitNum + ' ' + type;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerHTML = msg;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function loadMistakeBook() {
      try {
        const raw = localStorage.getItem(MISTAKE_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return [];
        const now = Date.now();
        const savedAt = parsed.savedAt || 0;
        const expireMs = MISTAKE_EXPIRE_DAYS * 24 * 60 * 60 * 1000;
        if (savedAt && (now - savedAt > expireMs)) {
          localStorage.removeItem(MISTAKE_STORAGE_KEY);
          return [];
        }
        return Array.isArray(parsed.list) ? parsed.list.filter(m => m && m.t && m.u) : [];
      } catch {
        return [];
      }
    }

    function saveMistakeBook() {
      try {
        if (!Array.isArray(mistakeBook) || mistakeBook.length === 0) {
          localStorage.removeItem(MISTAKE_STORAGE_KEY);
          return;
        }
        localStorage.setItem(MISTAKE_STORAGE_KEY, JSON.stringify({ savedAt: Date.now(), list: mistakeBook }));
      } catch {}
    }

    function startGame() {
      const checks = [...document.querySelectorAll('input[type="checkbox"]:checked')];
      if (!checks.length) {
        showToast('💡 请先挑选单元卡片哦');
        return;
      }

      isMarked = false;
      playQueue = [];
      checks.forEach(c => {
        const u = c.value;
        if (data[u]) {
          data[u].forEach(txt => playQueue.push({ t: txt, u }));
        }
      });

      shuffle(playQueue);
      index = 0;
      round = 1;
      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      render();
    }

    function nextCard() {
      isMarked = false;
      document.getElementById('mark-hint').innerText = '';
      index += 1;

      if (index >= playQueue.length) {
        if (isMistakePractice) {
          if (mistakeBook.length === 0) {
            showToast('🎉 错题全部掌握！太棒了！');
          } else {
            showToast('👏 本轮错题练习完成<br><span style="font-size:1rem;color:#94a3b8;">还剩 ' + mistakeBook.length + ' 个，继续加油</span>');
          }
          setTimeout(() => exitGame(), 1800);
          return;
        }

        round += 1;
        index = 0;
        shuffle(playQueue);
        showToast('✨ 第 ' + (round - 1) + ' 轮练习挑战成功！<br><span style="font-size:1rem;color:#94a3b8;">马上开启第 ' + round + ' 轮</span>');
      }
      render();
    }

    function prevCard() {
      isMarked = false;
      document.getElementById('mark-hint').innerText = '';
      index -= 1;
      if (index < 0) index = playQueue.length - 1;
      render();
    }

    function markMistake() {
      const item = playQueue[index];
      if (!item) return;

      if (isMistakePractice) {
        mistakeBook = mistakeBook.filter(m => !(m && m.t === item.t && m.u === item.u));
        saveMistakeBook();

        if (mistakeBook.length === 0) {
          showToast('🎉 错题全部学会啦！');
          setTimeout(() => exitGame(), 1500);
          return;
        }

        index += 1;
        if (index >= playQueue.length) {
          showToast('👏 本轮练习完成<br><span style="font-size:1rem;color:#94a3b8;">还剩 ' + mistakeBook.length + ' 题</span>');
          setTimeout(() => exitGame(), 1800);
          return;
        }
        isMarked = false;
        render();
        return;
      }

      if (isMarked) {
        mistakeBook = mistakeBook.filter(m => !(m && m.t === item.t && m.u === item.u));
        isMarked = false;
        document.getElementById('mark-hint').innerText = '已取消记入错题';
      } else {
        const existing = mistakeBook.find(m => m && m.t === item.t && m.u === item.u);
        if (existing) {
          existing.count += 1;
        } else {
          mistakeBook.push({ t: item.t, u: item.u, count: 1 });
        }
        isMarked = true;
        document.getElementById('mark-hint').innerText = '❌ 已记入生词错题本';
      }
      saveMistakeBook();
    }

    function render() {
      const item = playQueue[index];
      if (!item) return;

      document.getElementById('text-content').innerText = item.t;
      document.getElementById('round-txt').innerText = round;

      if (isMistakePractice) {
        document.getElementById('unit-txt').innerText = '🔥 错题特训模式';
        document.getElementById('left-txt').innerText = mistakeBook.length;
      } else {
        document.getElementById('unit-txt').innerText = getUnitName(item.u);
        const left = playQueue.length - (index + 1);
        document.getElementById('left-txt').innerText = left < 0 ? 0 : left;
      }

      if (Array.isArray(mistakeBook)) {
        isMarked = mistakeBook.some(m => m && m.t === item.t && m.u === item.u);
      } else {
        isMarked = false;
        mistakeBook = [];
      }

      const markHint = document.getElementById('mark-hint');
      if (isMistakePractice) {
        markHint.innerText = '';
      } else if (isMarked) {
        markHint.innerText = '❌ 已记入生词错题本';
      } else {
        markHint.innerText = '';
      }
    }

    function exitGame() {
      isMistakePractice = false;
      const mistakeBtn = document.getElementById('mistake-btn');
      if (mistakeBtn) mistakeBtn.innerText = '🤔 不认识';
      document.getElementById('game-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'flex';
    }

    function viewMistakeBook() {
      const container = document.getElementById('mistake-list-container');
      const badge = document.getElementById('mistake-count');
      const practiceBtn = document.getElementById('practice-mistake-btn');

      badge.innerText = mistakeBook.length + ' 个';
      if (practiceBtn) practiceBtn.disabled = !mistakeBook || mistakeBook.length === 0;

      if (mistakeBook.length === 0) {
        container.innerHTML = '<div class="mistake-empty">暂无错题，太棒了！🌟</div>';
      } else {
        let html = '';
        mistakeBook.forEach(item => {
          if (item) {
            const unitName = getUnitName(item.u);
            html += `
              <div class="mistake-item">
                <div class="mistake-item-text">
                  <div class="text">${escapeHtml(item.t)}</div>
                  <div class="unit">${unitName}</div>
                </div>
                <div class="count">错误 ${item.count || 1} 次</div>
              </div>
            `;
          }
        });
        container.innerHTML = html;
      }

      document.getElementById('selection-screen').style.display = 'none';
      document.getElementById('mistake-screen').style.display = 'flex';
    }

    function startMistakePractice() {
      if (!mistakeBook || mistakeBook.length === 0) return;

      isMistakePractice = true;
      isMarked = false;
      playQueue = mistakeBook.map(m => ({ t: m.t, u: m.u }));
      shuffle(playQueue);
      index = 0;
      round = 1;

      document.getElementById('mistake-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('mistake-btn').innerText = '✅ 已经掌握';
      render();
    }

    function backFromMistakeBook() {
      document.getElementById('mistake-screen').style.display = 'none';
      document.getElementById('selection-screen').style.display = 'flex';
    }

    function clearMistakeBook() {
      if (!confirm('确定清空错题本吗？')) return;
      mistakeBook = [];
      saveMistakeBook();
      viewMistakeBook();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
